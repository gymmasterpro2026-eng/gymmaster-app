name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK para Celular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Get Version from package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          VERSION=${{ steps.package-version.outputs.version }}
          cp android/app/build/outputs/apk/debug/app-debug.apk GymMaster_v${VERSION}_Espejo.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package-version.outputs.version }}-build-${{ github.run_number }}
          name: "GymMaster PRO v${{ steps.package-version.outputs.version }} (build #${{ github.run_number }})"
          body: |
            ## GymMaster PRO v${{ steps.package-version.outputs.version }}
            
            ¡Aquí está tu aplicación Android lista para instalar!
            
            ### ¿Cómo instalar en el celular?
            1. Desde tu celular, descarga el archivo **`GymMaster_v${{ steps.package-version.outputs.version }}_Espejo.apk`** que está abajo.
            2. Ábrelo y dale a "Instalar".
            3. (Si te pide permisos para instalar desde fuentes desconocidas, acéptalos).
            4. ¡Listo! Ya tienes la app en la pantalla de inicio.
            
          fail_on_unmatched_files: false
          files: |
            GymMaster_v${{ steps.package-version.outputs.version }}_Espejo.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
